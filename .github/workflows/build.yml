name: Build Binaries
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag/version to build. Defaults to package.json version.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Pack npm Candidate
    runs-on: ubuntu-22.04

    steps:

      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: 'npm'

      - name: Install Modules
        run: npm ci --ignore-scripts

      - name: Store npm Candidate
        uses: node-3d/addon-tools/actions/npm-candidate-upload@1073c0a6403f6c20df2135f03950a568e865aa16

  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2022
            node_arch: x64
            archflags: ''
          - target: linux-x64
            os: ubuntu-22.04
            node_arch: x64
            archflags: ''
          - target: linux-arm64
            os: ubuntu-22.04-arm
            node_arch: arm64
            archflags: ''
          - target: darwin-x64
            os: macos-26-intel
            node_arch: x64
            archflags: '-arch x86_64'
          - target: darwin-arm64
            os: macos-26
            node_arch: arm64
            archflags: '-arch arm64'

    runs-on: ${{ matrix.os }}

    steps:

      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
          cache: 'npm'

      - name: Print Native Target
        run: |
          echo "runner=$(uname -s)-$(uname -m)"
          node -p "'node=' + process.version + ' platform=' + process.platform + ' arch=' + process.arch"
          npm config get arch

      - name: Cache Steamworks SDK
        uses: actions/cache@v6
        with:
          path: .sdk
          key: steamworks-sdk-${{ secrets.STEAM_SDK_GZ_SHA }}

      - name: Install Modules
        run: npm ci

      - name: Build Current Binary
        run: npm run build:rebuild
        env:
          ARCHFLAGS: ${{ matrix.archflags }}
          STEAM_SDK_GZ_LINK: ${{ secrets.STEAM_SDK_GZ_LINK }}
          STEAM_SDK_GZ_SHA: ${{ secrets.STEAM_SDK_GZ_SHA }}

      - name: Verify macOS deployment target
        if: startsWith(matrix.target, 'darwin-')
        run: |
          set -euo pipefail
          checked=0
          while IFS= read -r -d '' file; do
            versions="$(otool -l "$file" | awk '
              $1 == "cmd" {
                wanted = $2 == "LC_BUILD_VERSION" ? "minos" : ($2 == "LC_VERSION_MIN_MACOSX" ? "version" : "")
              }
              wanted != "" && $1 == wanted { print $2; wanted = "" }
            ')"
            if [ -z "$versions" ] || printf '%s\n' "$versions" | grep -Evxq '13\.5(\.0)?'; then
              echo "Unexpected or missing macOS deployment target: $file" >&2
              printf '%s\n' "$versions" >&2
              exit 1
            fi
            checked=$((checked + 1))
          done < <(find bin-* -type f -name 'steam-api.node' -print0)
          test "$checked" -gt 0
          echo "Verified $checked Mach-O files target macOS 13.5"
      - name: Store Native Candidate
        uses: node-3d/addon-tools/actions/native-candidate-upload@1073c0a6403f6c20df2135f03950a568e865aa16
        with:
          artifact-name: native-${{ matrix.target }}

  consumer:
    name: Consumer Install (${{ matrix.target }})
    needs: [package, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2022
            node_arch: x64
            binary_artifact: native-windows-x64
          - target: windows-x64-on-arm
            os: windows-11-arm
            node_arch: x64
            binary_artifact: native-windows-x64
          - target: linux-x64
            os: ubuntu-22.04
            node_arch: x64
            binary_artifact: native-linux-x64
          - target: linux-arm64
            os: ubuntu-22.04-arm
            node_arch: arm64
            binary_artifact: native-linux-arm64
          - target: darwin-x64
            os: macos-26-intel
            node_arch: x64
            binary_artifact: native-darwin-x64
          - target: darwin-arm64
            os: macos-26
            node_arch: arm64
            binary_artifact: native-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
      - name: Install Packed Consumer Candidate
        id: consumer
        uses: node-3d/addon-tools/actions/consumer-install@1073c0a6403f6c20df2135f03950a568e865aa16
        with:
          package-name: '@node-3d/steam-api'
          binary-artifact: ${{ matrix.binary_artifact }}
          fixture: test-consumer
      - name: Run Packed Consumer Tests
        working-directory: ${{ steps.consumer.outputs.directory }}
        run: npm test

  release:
    name: Publish Native Assets
    needs: consumer
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:

      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0

      - name: Get Package Version
        id: package-version
        run: |
          release_tag="${{ inputs.release_tag }}"
          if [ -z "$release_tag" ]; then
            release_tag="$(node -p "require('./package').version")"
          fi
          echo "version=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Download Binary Candidates
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release-candidates
          merge-multiple: true

      - name: Attest Binaries
        uses: actions/attest@v4
        with:
          subject-path: release-candidates/*.gz

      - name: Create Release and Store Binaries
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.package-version.outputs.version }}
          name: Release ${{ steps.package-version.outputs.version }}
          files: release-candidates/*.gz
